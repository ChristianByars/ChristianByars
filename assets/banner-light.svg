<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Christian Byars</title>
  <desc id="d">Big Data Analytics at SDSU, AI weather forecasting. Animated storm-radar banner.</desc>
  <style>
    .name{font:700 64px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
    .tag{font:500 28px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}
    .ring{fill:none;stroke:#a6192e;stroke-width:1.5;opacity:.25;transform-origin:930px 150px;animation:pulse 4s ease-out infinite}
    .r2{animation-delay:1.33s}.r3{animation-delay:2.66s}
    .arms{transform-origin:930px 150px;animation:spin 24s linear infinite}
    .arm{fill:none;stroke:#a6192e;stroke-width:3;stroke-linecap:round}
    .spark{fill:none;stroke:#a6192e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:draw 3s ease-out both}
    .fade{animation:fade 1.2s ease-out both}
    @keyframes pulse{from{transform:scale(.15);opacity:.9}to{transform:scale(1);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
